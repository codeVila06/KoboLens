name: Refresh CPI Data

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch live CPI data
        run: npx tsx scripts/fetch-live-cpi.ts

      - name: Build CPI dataset
        run: npm run build:cpi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cpi.data.json scripts/raw-cpi-data.csv
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh CPI data"
            git push
          fi
